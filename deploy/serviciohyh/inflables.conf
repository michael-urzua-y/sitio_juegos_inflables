# Virtual host para el nginx existente del VPS (se copia a /opt/taller/nginx/conf.d/).
# Cloudflare (modo Full) → hyh-nginx → contenedor inflables-web (gunicorn, puerto 8000).

server {
    listen 80;
    server_name inflables.serviciohyh.cl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name inflables.serviciohyh.cl;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Fotos del admin (la app acepta hasta 25 MB)
    client_max_body_size 25m;

    # Instancia de prueba en un subdominio ajeno: que los buscadores no la indexen
    add_header X-Robots-Tag "noindex, nofollow" always;

    # IP real del visitante: CF-Connecting-IP solo si la conexión viene de Cloudflare.
    # Rangos: https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # El contenedor se resuelve en cada petición y no al arrancar: si el sitio está apagado,
    # solo este subdominio responde 502 y nginx sigue funcionando para los demás sitios.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $inflables_upstream http://inflables-web:8000;

    location / {
        proxy_pass $inflables_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # La app (ProxyFix, TRUST_PROXY=1) toma estos valores: se fijan aquí para que el
        # visitante no pueda falsificarlos (IP de la sesión atada y límite de intentos).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;   # conversión de fotos a AVIF desde el admin
    }
}
